# ===========================================================================
# MULTI-HOST OVERLAY — loaded only when IR_MESH_MULTIHOST=1: publishes each sidecar's public
# listener on the HOST (on the SERVICE, which owns the shared namespace) at distinct ports
# matching IR_MESH_PORT_<SVC> in the catalog. Traffic is Connect mTLS, so publishing widens
# reachability, not authorization — which is why single-host never loads this file.
# ===========================================================================
services:
  db:
    ports: ["${IR_MESH_PORT_DB:-21001}:21000"]
  minio:
    ports: ["${IR_MESH_PORT_MINIO:-21002}:21000"]
  vault:
    ports: ["${IR_MESH_PORT_VAULT:-21003}:21000"]
  backend:
    ports: ["${IR_MESH_PORT_BACKEND:-21004}:21000"]
  worker:
    ports: ["${IR_MESH_PORT_WORKER:-21005}:21000"]
  frontend:
    ports: ["${IR_MESH_PORT_FRONTEND:-21006}:21000"]
  puller:
    ports: ["${IR_MESH_PORT_PULLER:-21007}:21000"]
  redis:
    ports: ["${IR_MESH_PORT_REDIS:-21008}:21000"]
  oauth2-proxy:
    ports: ["${IR_MESH_PORT_OAUTH2_PROXY:-21009}:21000"]
