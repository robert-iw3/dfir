# ===========================================================================
# TIER: remediation agent — the executor for admin-requested repairs, in its OWN project so the
# mesh-reattach repair (which runs `deploy.sh enclave`) can never recreate its executor mid-
# flight. network_mode none + pid host: it holds only the runtime socket, the only input is an
# action NAME matched against its own allow-list, and namespace checks read /proc/<pid>/ns which
# are host pids.
# ===========================================================================
services:
  remediation-agent:
    build:
      context: ../..
      dockerfile: troubleshooting/Dockerfile.agent
    image: localhost/ir-remediation-agent:latest
    network_mode: none
    pid: host
    # The socket and the checkout carry host SELinux labels; relabeling either would break
    # the host, so labeling is disabled for this container instead.
    security_opt: [label=disable]
    volumes:
      - ${IR_RUNTIME_SOCKET}:/run/podman/podman.sock
      # At its HOST path, because -v arguments in the repair scripts are resolved by the
      # host-side runtime — the same string has to mean the same file on both sides.
      - ${IR_PLATFORM_DIR}:${IR_PLATFORM_DIR}
    environment:
      CONTAINER_HOST: unix:///run/podman/podman.sock
      IR_AGENT_HOST: ${IR_AGENT_HOST}
      IR_PLATFORM_DIR: ${IR_PLATFORM_DIR}
    entrypoint: ["/bin/bash", "${IR_PLATFORM_DIR}/troubleshooting/remediation-agent.sh"]
    restart: unless-stopped
