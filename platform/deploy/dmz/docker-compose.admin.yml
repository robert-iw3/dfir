# DMZ administrative access — `admin/adminctl.sh up dmz` opens it on demand; management interfaces
# are unreachable at every other moment. It joins the DMZ networks ONLY, so an admin cannot pivot
# inward — the isolation is the network membership, not the target list.
services:
  adminfwd:
    # Carries socat already: these tiers have no internet gateway to install it from.
    image: docker.io/alpine/socat:latest
    container_name: ir-dmz_adminfwd_1
    environment:
      ADMIN_TIER: dmz
      # Resolved by admin/adminctl.sh to each container's address on this tier's
      # network, so a target that is not on that network simply has no forwarder.
      # Covers: evidence receiver, headscale control.
      ADMIN_TARGETS: "${ADMIN_TARGETS}"
      ADMIN_TTL: "${ADMIN_TTL:-}"
    volumes:
      - ../../admin/adminfwd.sh:/adminfwd.sh:ro,z
    entrypoint: ["sh"]
    command: ["/adminfwd.sh"]
    # Bound to the management address, never every interface.
    ports:
      - "${IR_MGMT_BIND:-127.0.0.1}:18090:18090"   # evidence receiver health/queue
      - "${IR_MGMT_BIND:-127.0.0.1}:18081:18081"   # headscale control
    # `edge` only: dmzlink carries enclave services, and joining it would give a DMZ admin reach into
    # the enclave — the pivot this split prevents. Every DMZ target below is reachable on edge.
    networks: [edge]

networks:
  edge:
    external: true
    name: ir-edge
