# SSO ingress — ONE origin, path-routed.
#
# Everything the analyst's browser touches is served from https://ir-platform.local:8443:
#   /realms/irplatform/*  Keycloak login (the IdP; admin console is NOT exposed)
#   /oauth2/*             oauth2-proxy callback + sign-in (must bypass forward-auth)
#   /                     the app, gated by forward-auth
#
# One origin for the whole application: OAuth redirects and cookies are origin-sensitive,
# and a single brokered port means a single firewall rule at the DMZ boundary.
http:
  routers:
    # 1. The IdP's login endpoints. No forward-auth: this is what you use *to* log in.
    #    Only the realm's own paths — the admin console and master realm are refused below.
    idp-login:
      rule: "PathPrefix(`/realms/irplatform`) || PathPrefix(`/resources/`)"
      entryPoints: [websecure]
      service: keycloak
      priority: 300
      tls:
        options: default
      middlewares: [sec-headers, ratelimit, inflight]

    # 2. Keycloak admin console / master realm / admin REST — denied to the analyst side.
    #    Administration is an MGMT-VLAN activity (deploy/NETWORKING.md row 7).
    idp-deny:
      rule: "PathPrefix(`/admin`) || PathPrefix(`/realms/master`)"
      entryPoints: [websecure]
      service: keycloak
      priority: 290
      tls:
        options: default
      middlewares: [deny-all]

    # 3. oauth2-proxy's own endpoints (callback, sign-in, sign-out). Must bypass the
    #    forward-auth middleware or the login target would itself require login.
    sso-endpoints:
      rule: "PathPrefix(`/oauth2/`)"
      entryPoints: [websecure]
      service: oauth2-proxy
      priority: 200
      tls:
        options: default
      middlewares: [sec-headers, ratelimit, inflight]

    # 4. Everything else = the application, served through the SSO gate. oauth2-proxy
    #    redirects unauthenticated users to Keycloak, handles the callback, then proxies
    #    to the SPA with the authenticated identity attached as headers.
    ir-web:
      rule: "PathPrefix(`/`)"
      entryPoints: [websecure]
      service: oauth2-proxy
      priority: 1
      tls:
        options: default
      middlewares: [sec-headers, app-csp, ratelimit, inflight]

  services:
    oauth2-proxy:
      loadBalancer:
        servers: [{ url: "http://oauth2-proxy:4180" }]
    keycloak:
      loadBalancer:
        servers: [{ url: "http://keycloak:8080" }]

  middlewares:
    deny-all:
      ipAllowList:
        sourceRange: ["127.0.0.1/32"]

    # Response headers. Two jobs: assert the browser-side protections, and stop the server
    # naming itself (SRG-APP-000266-WSR-000159) — an empty value REMOVES the header, so
    # Server and X-Powered-By from any upstream are stripped on the way out.
    sec-headers:
      headers:
        customResponseHeaders:
          Server: ""
          X-Powered-By: ""
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: "no-referrer"
        permissionsPolicy: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

    # The React bundle is mobile code (SRG-APP-000206-WSR-000128). The policy codifies what is
    # already true — the application loads no third-party origin — so a bundle that starts
    # reaching one is refused by the browser rather than silently trusted.
    #
    # Applied to the application only. The identity provider serves its own login page with its
    # own policy, and overriding it here would break the form this gate depends on.
    app-csp:
      headers:
        contentSecurityPolicy: >-
          default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';
          img-src 'self' data:; font-src 'self' data:; connect-src 'self';
          object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'

    # Request rate per source (SRG-APP-000246-WSR-000149). Every analyst arrives from the
    # egress worker, so the source is shared: this bounds the platform's total request rate,
    # which is the denial-of-service property that matters here.
    ratelimit:
      rateLimit:
        average: 100
        burst: 200
        period: 1s

    # Simultaneous in-flight requests (SRG-APP-000001-WSR-000001).
    inflight:
      inFlightReq:
        amount: 100

tls:
  # SRG-APP-000014-WSR-000006 and SRG-APP-000439-WSR-000188. Stated rather than defaulted: the
  # default suite list follows the library and changes with the image, and an explicit list is
  # also what removes export and null ciphers — they are absent because they are not named.
  #
  # TLS 1.2 minimum, AEAD suites only, forward secrecy on every suite. TLS 1.3 suites are not
  # configurable in Go and are always available above this floor.
  options:
    default:
      # Client certificates are requested only when smartcard logon is enabled, and requested
      # rather than required: demanding one at the handshake refuses the connection before
      # Keycloak can offer any other authenticator, so a user without a card — including the
      # administrator who would fix it — cannot reach the login page at all. Accept or reject
      # belongs in the authentication flow, where it is auditable.
      # __CLIENT_AUTH__
      minVersion: VersionTLS12
      sniStrict: true
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
      curvePreferences: [CurveP384, CurveP256]

  stores:
    default:
      defaultCertificate:
        certFile: /certs/ir-platform.crt
        keyFile: /certs/ir-platform.key
  certificates:
    - certFile: /certs/ir-platform.crt
      keyFile: /certs/ir-platform.key
