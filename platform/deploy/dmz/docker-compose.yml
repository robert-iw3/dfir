# ===========================================================================
# TIER: DMZ — deploys to its own hardware, separate from the enclave.
#
# Everything untrusted parties touch lives here and NOTHING here holds internal
# credentials or has a route into the enclave:
#   * ir-ingest RECEIVER — the only thing a (possibly compromised) endpoint can reach
#   * bastion broker     — a Boundary session client; one target, the enclave's SSO ingress
#   * headscale          — tailnet control plane, deny-by-default allow-list
#   * CoreDNS            — answers one name, REFUSES everything else (no DNS exfil)
#
#   podman-compose -p ir-dmz --env-file ../.env -f docker-compose.yml up -d
# ===========================================================================
networks:
  # Faces untrusted parties: endpoints shipping evidence, analyst workstations.
  # No gateway — nothing on this side may reach the internet through us.
  edge:
    external: true
    name: ir-edge
  # Faces the enclave hardware. In a real deployment this is the routed link between
  # the DMZ and enclave segments, firewalled to the flows in NETWORKING.md.
  dmzlink:
    external: true
    name: ir-dmzlink

services:
  # Untrusted-facing evidence receiver: verifies custody, holds opaque blobs for the enclave to
  # pull. Deliberately NOT on any enclave-bound network.
  receiver:
    build:
      context: ../..
      dockerfile: dmz/Dockerfile.receiver
    image: localhost/ir-receiver:latest
    env_file: ../.env
    environment:
      RECEIVER_HOLDING: /holding
      # Evidence is a memory image: the host's credentials, keys and open files. The receiver
      # refuses to start without these, because a receiver that quietly falls back to plaintext
      # produces collections that look successful while the host's memory crossed the wire in
      # the clear — and nobody finds out until it no longer matters.
      RECEIVER_TLS_CERT: /certs/receiver.crt
      # Demanded before the holding area is read or a bundle deleted. Unset means refuse.
      RECEIVER_PULLER_TOKEN: ${RECEIVER_PULLER_TOKEN}
      RECEIVER_TLS_KEY: /certs/receiver.key
    volumes:
      - ../../dmz/certs:/certs:ro,z
      - receiver-holding:/holding
      # Symbol bundles are held apart from evidence: different origin, different checks.
      - receiver-isf:/holding-isf
    networks: [edge, dmzlink]
    ports:
      - "${RECEIVER_PORT}:8090"

  # The bastion's tailnet node — the WireGuard endpoint workstations connect to, with a real tun
  # device so the broker can bind it and non-reachability stays a routing fact. NET_ADMIN is scoped
  # to this namespace only, HEADSCALE_ADDR is a name so it survives a network recreate, and no
  # routes are advertised — subnet routes are exactly what would let a workstation reach Postgres
  # directly.
  bastion:
    image: docker.io/tailscale/tailscale:v1.98.10
    hostname: bastion
    dns: ["${DNS_EDGE_IP}"]          # the DMZ resolver is the ONLY resolver
    dns_search: ["${RUNTIME_DNS_ZONE}"]
    volumes:
      - ../../hashicorp/access/certs/headscale.crt:/certs/headscale.crt:ro,z
      - bastion-state:/var/lib/tailscale
    environment:
      # tailscaled is Go, and Go's TLS honors SSL_CERT_FILE. Pointing it at the control plane's
      # certificate REPLACES the system trust pool for this process, so it will verify headscale
      # and nothing else — which is the whole of what it should ever connect to.
      SSL_CERT_FILE: /certs/headscale.crt
      TS_AUTHKEY: "${TS_BASTION_AUTHKEY:-}"
      TS_EXTRA_ARGS: "--login-server=${HEADSCALE_LOGIN_URL} --hostname=bastion --accept-routes=false"
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      # magic_dns is off on this tailnet, so there is nothing for tailscaled to
      # publish — and letting it manage /etc/resolv.conf breaks resolution for
      # every container sharing this namespace, the broker included.
      TS_ACCEPT_DNS: "false"
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add: [NET_ADMIN, NET_RAW]
    networks:
      # The broker shares this namespace, so the analyst-facing address and name belong to the bastion:
      # tunnel traffic and not-yet-enrolled workstations land on the same session listener. That keeps
      # enrollment from being a chicken-and-egg problem.
      edge:
        # The analyst-facing name resolves HERE, never to an internal host. No pinned address:
        # the DMZ resolver rewrites the platform name to `bastion` and the runtime answers with
        # wherever this container currently is.
        aliases: [ir-platform.local]
      dmzlink:

  # The analyst's route into the enclave: a Boundary session held open on the brokered port — a
  # CLIENT only, since a worker here would need the enclave route this tier split denies. It shares
  # the bastion's namespace so the listener binds the tailnet interface, and holds no key material
  # beyond the analyst credential.
  broker:
    image: docker.io/hashicorp/boundary:0.21.3
    network_mode: "service:bastion"
    depends_on: [bastion]
    environment:
      # https, and pinned: this carries the analyst's password and the session token across the
      # one link that leaves this tier. The script refuses a plaintext address outright.
      BOUNDARY_ADDR: https://${BOUNDARY_HOST:-boundary}:9200   # controller, in the enclave
      BOUNDARY_CACERT: /boundary/certs/boundary.crt
      BOUNDARY_TARGET_ID: ${BOUNDARY_TARGET_ID:-}
      BOUNDARY_AUTH_METHOD_ID: ${BOUNDARY_AUTH_METHOD_ID:-}
      # Scopes the startup reap of this principal's abandoned sessions.
      BOUNDARY_PROJECT_ID: ${BOUNDARY_PROJECT_ID:-}
      BOUNDARY_ANALYST_LOGIN: ${BOUNDARY_ANALYST_LOGIN:-analyst}
      BOUNDARY_ANALYST_PASSWORD: ${BOUNDARY_ANALYST_PASSWORD}
      # Independent sessions on loopback ports, one each: a single shared session is a fleet-wide
      # failure domain under connection churn. See planning/SCALE-50-WORKSTATIONS.md.
      BROKER_SESSION_BASE: ${BROKER_SESSION_BASE}
      BROKER_SESSIONS: ${BROKER_SESSIONS}
    volumes:
      - ../../hashicorp/access/boundary_session.sh:/session.sh:ro,z
      # The certificate only. The key stays in the enclave, on the controller.
      - ../../hashicorp/access/certs/boundary.crt:/boundary/certs/boundary.crt:ro,z
    entrypoint: ["/bin/sh", "/session.sh"]
    # The analyst path IS this container. When the session client reaches a state it cannot
    # recover in place — a listener that stopped accepting while the process stayed alive —
    # it exits, and recovery is a fresh container rather than in-script repair, which was
    # shown to stall holding no listener at all.
    restart: unless-stopped

  # The analyst-facing port: spreads new connections across the broker's sessions, redispatches past
  # dead ones, and bounds the setup rate (concurrent setups corrupt a session client's WebSocket).
  # mode tcp, byte-for-byte — the analyst's TLS stays end-to-end and this process reads none of it.
  distributor:
    image: docker.io/library/haproxy:3.4.3-alpine
    network_mode: "service:bastion"
    depends_on: [bastion]
    # haproxy's own entrypoint expects a config file; this one is generated from
    # BROKER_SESSIONS, which decides how many backends there are.
    entrypoint: ["/bin/sh", "/distributor.sh"]
    environment:
      BROKER_LISTEN: ${BROKER_LISTEN}
      BROKER_SESSION_BASE: ${BROKER_SESSION_BASE}
      BROKER_SESSIONS: ${BROKER_SESSIONS}
      BROKER_ACCEPT_RATE: ${BROKER_ACCEPT_RATE}
      BOUNDARY_EGRESS_WORKERS: ${BOUNDARY_EGRESS_WORKERS}
    volumes:
      - ../../hashicorp/access/broker_distributor.sh:/distributor.sh:ro,z
      # Workstation pinning map (`<ws-id> <tailnet-addr>` per line), written by
      # `deploy.sh workstation` after the node registers and re-read on a graceful reload
      # (SIGUSR2). Empty or absent means no pinning: every source spreads leastconn.
      - ./rendered:/distributor-map:z
    # The analyst-facing listener. If it is gone there is no path at all, and unlike a
    # session there is nothing here to re-establish — a restart is the whole recovery.
    restart: unless-stopped

  headscale:
    image: docker.io/headscale/headscale:v0.29.3
    command: serve
    volumes:
      - ../../hashicorp/access/headscale.yaml:/etc/headscale/config.yaml:ro,z
      # Serves the control-plane API and the embedded DERP relay. Tailscale refuses to use a
      # relay that is not TLS, and says nothing when it declines — the node reports itself
      # connected while having no fallback path at all.
      - ../../hashicorp/access/certs:/etc/headscale/certs:ro,z
      - ../../hashicorp/access/policy.hujson:/etc/headscale/policy.hujson:ro,z
      - headscale-data:/var/lib/headscale
    # Published because workstations are separate machines reaching the DMZ's routable address
    # (HEADSCALE_ADDR). 3478/udp is STUN for the direct path; without it every packet relays.
    ports:
      - "${HEADSCALE_PORT}:8080"
      - "${HEADSCALE_STUN_PORT}:3478/udp"
    networks:
      # On the edge network for the nodes that run beside it, and on dmzlink so the resolver
      # and receiver share a segment. Addressed by name — `headscale` — which is what
      # HEADSCALE_ADDR carries; off-host nodes use the published port instead.
      edge:
      dmzlink:

  # The analyst side's ONLY resolver: one name answered, everything else REFUSED.
  coredns:
    image: docker.io/coredns/coredns:1.14.6
    command: ["-conf", "/etc/coredns/Corefile"]
    user: "0:0"
    volumes:
      - ../../hashicorp/access/Corefile:/etc/coredns/Corefile:ro,z
    networks:
      edge:
        ipv4_address: ${DNS_EDGE_IP}

volumes:
  receiver-holding:
  receiver-isf:
  headscale-data:
  bastion-state:
