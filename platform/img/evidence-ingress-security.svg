<svg width="1400" height="780" viewBox="0 0 1400 780" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="s-allow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00CA8E"/></marker>
    <marker id="s-pull" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#CA2171"/></marker>
    <marker id="s-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1DAEFF"/></marker>
    <marker id="s-deny" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F05A28"/></marker>
  </defs>

  <rect x="0" y="0" width="1400" height="780" fill="#16161B"/>
  <text x="700" y="36" fill="#FFFFFF" font-size="21" font-weight="600" text-anchor="middle">Evidence ingress — brokered, one-way, malware-contained</text>
  <text x="700" y="60" fill="#8A8A93" font-size="12.5" text-anchor="middle">The endpoint is assumed compromised. It reaches only the DMZ; the enclave PULLS verified evidence; hazardous analysis is sandboxed with no network.</text>

  <!-- zones -->
  <rect x="25" y="86" width="285" height="545" rx="10" fill="#0B0B0C" stroke="#F05A28" stroke-width="1.5"/>
  <text x="167" y="110" fill="#F05A28" font-size="12" font-weight="600" text-anchor="middle">ENDPOINT — ASSUME COMPROMISED</text>

  <rect x="340" y="86" width="335" height="545" rx="10" fill="#0B0B0C" stroke="#00CA8E" stroke-width="1.5"/>
  <text x="507" y="110" fill="#00CA8E" font-size="12" font-weight="600" text-anchor="middle">DMZ (untrusted-facing)</text>

  <rect x="705" y="86" width="670" height="545" rx="10" fill="#0B0B0C" stroke="#1DAEFF" stroke-width="1.5"/>
  <text x="1040" y="110" fill="#1DAEFF" font-size="12" font-weight="600" text-anchor="middle">INTERNAL ENCLAVE — accepts NO inbound</text>

  <!-- endpoint -->
  <rect x="50" y="250" width="235" height="215" rx="8" fill="#25252B" stroke="#F05A28" stroke-width="1.5"/>
  <text x="167" y="278" fill="#FFFFFF" font-size="14" font-weight="600" text-anchor="middle">Endpoint (compromised)</text>
  <text x="167" y="298" fill="#8A8A93" font-size="10.5" text-anchor="middle">privileged collector container</text>
  <rect x="70" y="314" width="195" height="30" rx="5" fill="#16161B" stroke="#4A4A52"/>
  <text x="167" y="334" fill="#EAEAEA" font-size="10.5" text-anchor="middle">collect → capture → seal</text>
  <rect x="70" y="350" width="195" height="30" rx="5" fill="#16161B" stroke="#00CA8E"/>
  <text x="167" y="370" fill="#EAEAEA" font-size="10.5" text-anchor="middle">signed evidence bundle</text>
  <rect x="70" y="392" width="195" height="52" rx="5" fill="#16161B" stroke="#F05A28" stroke-dasharray="4 3"/>
  <text x="167" y="412" fill="#8A8A93" font-size="10" text-anchor="middle">no route to any internal</text>
  <text x="167" y="428" fill="#8A8A93" font-size="10" text-anchor="middle">service — DMZ only</text>

  <!-- DMZ receiver -->
  <rect x="365" y="205" width="285" height="300" rx="8" fill="#25252B" stroke="#00CA8E" stroke-width="1.5"/>
  <text x="507" y="233" fill="#FFFFFF" font-size="15" font-weight="600" text-anchor="middle">ir-ingest — RECEIVER</text>
  <text x="507" y="252" fill="#8A8A93" font-size="10.5" text-anchor="middle">the only thing the endpoint can reach</text>
  <rect x="385" y="266" width="245" height="28" rx="5" fill="#16161B" stroke="#00CA8E"/>
  <text x="507" y="285" fill="#EAEAEA" font-size="10.5" text-anchor="middle">① accept bundle, then CLOSE conn</text>
  <rect x="385" y="300" width="245" height="28" rx="5" fill="#16161B" stroke="#00CA8E"/>
  <text x="507" y="319" fill="#EAEAEA" font-size="10.5" text-anchor="middle">② verify custody seal</text>
  <rect x="385" y="334" width="245" height="28" rx="5" fill="#16161B" stroke="#F05A28"/>
  <text x="507" y="353" fill="#EAEAEA" font-size="10.5" text-anchor="middle">③ fail → quarantine + drop</text>
  <rect x="385" y="368" width="245" height="28" rx="5" fill="#16161B" stroke="#4A4A52"/>
  <text x="507" y="387" fill="#EAEAEA" font-size="10.5" text-anchor="middle">④ hold as opaque blob (never run)</text>
  <rect x="385" y="410" width="245" height="46" rx="5" fill="#16161B" stroke="#F05A28" stroke-dasharray="4 3"/>
  <text x="507" y="430" fill="#8A8A93" font-size="10" text-anchor="middle">holds NO internal creds ·</text>
  <text x="507" y="445" fill="#8A8A93" font-size="10" text-anchor="middle">CANNOT initiate into the enclave</text>

  <!-- internal puller -->
  <rect x="730" y="150" width="300" height="150" rx="8" fill="#25252B" stroke="#1DAEFF" stroke-width="1.5"/>
  <text x="880" y="178" fill="#FFFFFF" font-size="15" font-weight="600" text-anchor="middle">ir-ingest — PULLER</text>
  <text x="880" y="198" fill="#8A8A93" font-size="10.5" text-anchor="middle">holds the internal creds (Vault)</text>
  <rect x="750" y="212" width="260" height="28" rx="5" fill="#16161B" stroke="#1DAEFF"/>
  <text x="880" y="231" fill="#EAEAEA" font-size="10.5" text-anchor="middle">initiates OUT → fetch verified → CLOSE</text>
  <rect x="750" y="246" width="260" height="28" rx="5" fill="#16161B" stroke="#1DAEFF"/>
  <text x="880" y="265" fill="#EAEAEA" font-size="10.5" text-anchor="middle">→ WORM store + validated metadata</text>

  <!-- stores -->
  <rect x="1055" y="150" width="295" height="66" rx="8" fill="#25252B" stroke="#8A8A93" stroke-width="1.5"/>
  <text x="1202" y="178" fill="#EAEAEA" font-size="13" text-anchor="middle">MinIO / S3 (WORM)</text>
  <text x="1202" y="197" fill="#8A8A93" font-size="10" text-anchor="middle">raw capture — opaque bytes</text>

  <rect x="1055" y="234" width="295" height="66" rx="8" fill="#25252B" stroke="#8A8A93" stroke-width="1.5"/>
  <text x="1202" y="262" fill="#EAEAEA" font-size="13" text-anchor="middle">PostgreSQL</text>
  <text x="1202" y="281" fill="#8A8A93" font-size="10" text-anchor="middle">schema-validated metadata</text>

  <!-- sandbox -->
  <rect x="730" y="360" width="620" height="150" rx="8" fill="#25252B" stroke="#CA2171" stroke-width="2"/>
  <text x="1040" y="388" fill="#FFFFFF" font-size="15" font-weight="600" text-anchor="middle">Isolated analysis sandbox (worker)</text>
  <text x="1040" y="408" fill="#8A8A93" font-size="10.5" text-anchor="middle">pulls capture bytes from MinIO · parses hazardous evidence</text>
  <rect x="750" y="422" width="580" height="30" rx="5" fill="#16161B" stroke="#F05A28"/>
  <text x="1040" y="442" fill="#EAEAEA" font-size="10.5" text-anchor="middle">NO network egress · drop ALL caps · seccomp · read-only rootfs · non-root · ephemeral</text>
  <rect x="750" y="458" width="580" height="30" rx="5" fill="#16161B" stroke="#CA2171"/>
  <text x="1040" y="478" fill="#EAEAEA" font-size="10.5" text-anchor="middle">parser-exploit blast radius = one throwaway sandbox (no C2 out, no reach in) · results → Postgres</text>

  <!-- ===== flows ===== -->
  <!-- endpoint -> receiver -->
  <path d="M285,357 C315,357 335,352 363,352" fill="none" stroke="#00CA8E" stroke-width="2.4" marker-end="url(#s-allow)"/>
  <text x="325" y="340" fill="#00CA8E" font-size="9.5" font-weight="600" text-anchor="middle">TLS 1.3 · pinned cert</text>
  <text x="325" y="373" fill="#00CA8E" font-size="9.5" text-anchor="middle">one-way · then CLOSE</text>

  <!-- puller -> receiver (enclave initiates OUT, arrowhead at receiver) -->
  <path d="M728,250 C690,250 680,300 652,320" fill="none" stroke="#1DAEFF" stroke-width="2.4" marker-end="url(#s-data)"/>
  <text x="690" y="290" fill="#1DAEFF" font-size="9.5" font-weight="600" text-anchor="middle">enclave opens the</text>
  <text x="690" y="303" fill="#1DAEFF" font-size="9.5" text-anchor="middle">connection (outbound)</text>
  <text x="690" y="316" fill="#1DAEFF" font-size="9.5" text-anchor="middle">pulls verified · CLOSE</text>

  <!-- puller -> stores -->
  <path d="M1030,180 L1053,180" fill="none" stroke="#1DAEFF" stroke-width="1.8" marker-end="url(#s-data)"/>
  <path d="M1030,262 L1053,262" fill="none" stroke="#1DAEFF" stroke-width="1.8" marker-end="url(#s-data)"/>

  <!-- MinIO -> sandbox (pull bytes) -->
  <path d="M1150,216 C1150,300 1120,330 1090,358" fill="none" stroke="#CA2171" stroke-width="1.8" marker-end="url(#s-pull)"/>
  <text x="1180" y="300" fill="#CA2171" font-size="9.5" text-anchor="middle">pull bytes</text>
  <!-- sandbox -> Postgres (results) -->
  <path d="M990,360 C1010,330 1120,308 1150,302" fill="none" stroke="#1DAEFF" stroke-width="1.6" marker-end="url(#s-data)"/>
  <text x="1040" y="330" fill="#1DAEFF" font-size="9.5" text-anchor="middle">results</text>

  <!-- DENIED: DMZ -> internal -->
  <path d="M652,470 C680,470 700,470 726,470" fill="none" stroke="#F05A28" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#s-deny)"/>
  <circle cx="689" cy="470" r="13" fill="#16161B" stroke="#F05A28" stroke-width="2"/>
  <path d="M681,462 L697,478 M697,462 L681,478" stroke="#F05A28" stroke-width="2.2"/>
  <text x="689" y="512" fill="#F05A28" font-size="9.5" font-weight="600" text-anchor="middle">DENIED — no inbound</text>
  <text x="689" y="525" fill="#F05A28" font-size="9.5" text-anchor="middle">to the enclave</text>

  <!-- DENIED: sandbox egress -->
  <path d="M1040,510 L1040,556" fill="none" stroke="#F05A28" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#s-deny)"/>
  <circle cx="1040" cy="533" r="12" fill="#16161B" stroke="#F05A28" stroke-width="2"/>
  <path d="M1033,526 L1047,540 M1047,526 L1033,540" stroke="#F05A28" stroke-width="2"/>
  <text x="1120" y="537" fill="#F05A28" font-size="9.5" text-anchor="middle">no C2 egress</text>

  <!-- ===== security-property callouts ===== -->
  <rect x="25" y="648" width="330" height="110" rx="8" fill="#121722" stroke="#232c3d" stroke-width="1"/>
  <text x="40" y="670" fill="#EAEAEA" font-size="11" font-weight="600">1 · One-way + terminated</text>
  <text x="40" y="690" fill="#8A8A93" font-size="10">No persistent or bidirectional</text>
  <text x="40" y="705" fill="#8A8A93" font-size="10">channel back to the endpoint;</text>
  <text x="40" y="720" fill="#8A8A93" font-size="10">every transfer closes on completion.</text>

  <rect x="367" y="648" width="330" height="110" rx="8" fill="#121722" stroke="#232c3d" stroke-width="1"/>
  <text x="382" y="670" fill="#EAEAEA" font-size="11" font-weight="600">2 · Pull, never push in</text>
  <text x="382" y="690" fill="#8A8A93" font-size="10">The enclave initiates every</text>
  <text x="382" y="705" fill="#8A8A93" font-size="10">internal-bound transfer. Nothing</text>
  <text x="382" y="720" fill="#8A8A93" font-size="10">initiates INTO it — no path to ride.</text>

  <rect x="709" y="648" width="330" height="110" rx="8" fill="#121722" stroke="#232c3d" stroke-width="1"/>
  <text x="724" y="670" fill="#EAEAEA" font-size="11" font-weight="600">3 · Sandboxed analysis</text>
  <text x="724" y="690" fill="#8A8A93" font-size="10">A malicious-capture parser exploit</text>
  <text x="724" y="705" fill="#8A8A93" font-size="10">is contained to a no-egress,</text>
  <text x="724" y="720" fill="#8A8A93" font-size="10">ephemeral worker.</text>

  <rect x="1051" y="648" width="324" height="110" rx="8" fill="#121722" stroke="#232c3d" stroke-width="1"/>
  <text x="1066" y="670" fill="#EAEAEA" font-size="11" font-weight="600">4 · WORM + custody</text>
  <text x="1066" y="690" fill="#8A8A93" font-size="10">Evidence is opaque bytes, verified</text>
  <text x="1066" y="705" fill="#8A8A93" font-size="10">at the DMZ and re-verified inside;</text>
  <text x="1066" y="720" fill="#8A8A93" font-size="10">written once, immutable.</text>
</svg>
