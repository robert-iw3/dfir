SRG-APP-000131-WSR-000051:
  status: mitigated
  mechanism: 'Every external FROM names a DIGEST, not a tag. A tag is a mutable pointer — alpine:3.24
    is whatever the registry decides on the day of the build — so two builds of one source produced different
    images and neither could be said to be the one reviewed. Pulling by digest IS the integrity check:
    podman refuses content that does not hash to the name requested, so there is nothing further to verify
    at build time. ci/base-images.lock is the manifest record the control asks for. The Rust toolchain
    is RECORDED but not rewritten inline: build.sh passes RUST_VERSION from rust-toolchain.toml and an
    inline digest would silently win over that file.'
  evidence: ci/pin-base-images.sh (--check/--update/--apply), ci/base-images.lock, 16 FROM lines across
    backend, worker, collector, dmz, frontend, ingest, keycloak, workstation, re-workstation, consul sidecar,
    ntp, troubleshooting agent
  verified: 'uat_srg_webtier.sh — the check passes on the tree, and is proven to catch both failure modes
    by injection: a FROM reverted to a bare tag, and a FROM carrying a digest that disagrees with the
    lock'
SRG-APP-000131-WSR-000073:
