    drift was never the gap. The gap was that nothing recorded WHEN a review happened, so 'we check regularly'
    was unfalsifiable. --record writes the date AND the finding count, because a review that found five
    stale images and one that found none are different events; --age fails once the record passes the
    30-day ceiling the control names.
  evidence: ci/image-currency.sh (--record, --age), ci/image-currency.record
  verified: uat_srg_webtier.sh — the record exists, is within the interval, and the gate is proven to
    fail on an overdue record by backdating one
SRG-APP-001035-WSR-000340:
