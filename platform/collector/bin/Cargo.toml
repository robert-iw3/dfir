[package]
name = "ir-collect"
version = "0.1.0"
edition = "2024"
# The floor edition 2024 imposes. The exact build toolchain is pinned in rust-toolchain.toml;
# this is what a dependency is allowed to assume.
rust-version = "1.85"
description = "Field memory collector — one static binary, no runtime on the endpoint"

[dependencies]
# Acquisition. AVML as a LIBRARY, not a second executable: one artifact to deliver, nothing
# else written to memory, no helper binary to find or swap between write and execute.
# VERSION UNPINNED PENDING VERIFICATION — confirm the crate exposes the fallback chain
# (/proc/kcore -> /dev/crash -> /dev/mem) programmatically before committing to it.
avml = "*"

# Per-chunk Merkle. Multi-GB/s and parallel, so hashing keeps up with acquisition.
blake3 = "1"
# The custody claim, because SHA-256 is the forensic convention tooling and courts expect.
sha2 = "0.10"
hmac = "0.12"

# Per-chunk compression for raw/LiME. Never applied to AFF4 — see DATA-PIPELINE.md §2.
zstd = { version = "0.13", default-features = false }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Upload. rustls rather than OpenSSL so the artifact stays static and self-contained; the
# receiver's certificate is pinned, so no system trust store is consulted.
ureq = { version = "2", default-features = false, features = ["tls"] }

anyhow = "1"
libc = "0.2"

[profile.release]
opt-level = "z"      # size: the artifact crosses an SSH channel into memory
lto = true
codegen-units = 1
panic = "abort"      # no unwinding machinery; a panic on a suspect host should end the process
strip = true
