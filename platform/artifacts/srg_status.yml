SRG-APP-000920-WSR-000320:
  status: mitigated
  mechanism: 'The enclave runs its own chrony, staged beside the resolver and for the same reason: `internal:
    true` installs no route off the host, so both authorities must live inside the segment. It serves
    the enclave HOSTS, whose chrony clients discipline their own clocks; containers inherit from the host
    and cannot set time, so the service runs with -x and never touches a clock it does not own. This matters
    more here than on an ordinary web tier: temporal_coherence compares instants ACROSS hosts, so a drifting
    enclave does not produce a wrong-looking record, it places a plausible one at the wrong point on the
    timeline.'
  evidence: ntp/Dockerfile, ntp/chrony.conf, ntp/entrypoint.sh, deploy/enclave/docker-compose.yml (ntp
    on internal + dmzlink), deploy/deploy.sh stage 0a, ci/clock-sync-check.sh
  verified: uat_srg_webtier.sh — the service answers chronyc and is serving; the host clock is synchronized;
    and a container's clock is proven to agree with the host's, which is the inheritance the design assumed
    and had never tested
SRG-APP-000925-WSR-000330:
  status: mitigated
  mechanism: 'Comparison against an authoritative source, with the air gap stated rather than hidden.
    IR_NTP_UPSTREAM names the reference and the service is disciplined by it; unset, the service serves
    from a LOCAL stratum 10 reference and the check reports the segment as internally consistent but NOT
    traceable. Stratum 10 is deliberately poor so any client that can reach a real source prefers it.
    CONDITIONAL BY DESIGN: a deployment that names no upstream does not satisfy traceability, and the
    check says so instead of passing quietly — a check that failed on the designed air-gapped case would
    simply be turned off.'
  evidence: ntp/entrypoint.sh (upstream templating), ci/clock-sync-check.sh, deploy/.env IR_NTP_UPSTREAM
  verified: uat_srg_webtier.sh — when IR_NTP_UPSTREAM is set the upstream must actually be reached, so
    an unreachable server cannot read the same as a deliberate air gap; when unset the untraceable state
    is reported explicitly
