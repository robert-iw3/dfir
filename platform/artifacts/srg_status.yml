SRG-APP-000001-WSR-000001:
  status: mitigated
  mechanism: 'Three ceilings, all bounded rather than generous: the ingress bounds simultaneous in-flight
    requests and HTTP/2 streams, nginx bounds connections per source address, and request HEADER capacity
    is bounded by capping per-request CSRF cookies at the SSO gate instead of enlarging the server''s
    header buffers. Header buffers are per-connection memory and every analyst shares one source address
    through the broker, so sizing them to absorb unbounded cookie accumulation would have weakened the
    per-source bound to hide a fixable defect.'
  evidence: traefik/dynamic-sso/dynamic.yml (inflight), traefik/traefik.yml (http2.maxConcurrentStreams),
    frontend/nginx.conf.template (limit_conn, large_client_header_buffers 4 16k), deploy/enclave/docker-compose.yml
    (--cookie-csrf-per-request-limit)
  verified: test/uat_srg_webtier.sh — connection and stream limits asserted as deployed; the CSRF cookie
    cap is asserted at the gate and the header buffer asserted to remain at its bounded value, so a regression
    that widens it to absorb accumulation fails the test
SRG-APP-000001-WSR-000002:
  status: mitigated
  mechanism: 'Sessions are held server-side in Redis, not in the client''s cookie, so signing out or cancelling
    a session ends it for real. The gate is a mesh service in its own right: Redis binds loopback only,
    so the gate reaches it through its own Connect sidecar and its access is an intention rather than
    network reachability. Database 1 keeps analyst sessions out of the task broker''s keyspace.'
  evidence: deploy/enclave/docker-compose.yml (oauth2-proxy --session-store-type=redis, oauth2-proxy-
    sidecar), hashicorp/consul/config-entries/ir-redis.hcl, hashicorp/consul/register-mesh.sh
  verified: test/uat_srg_webtier.sh — a real authorization-code login through the ingress grows the session
    database from 0 to 1 key; with a cookie store that count never moves
SRG-APP-000220-WSR-000201:
  status: mitigated
  mechanism: Sign-out ends the gate session AND the Keycloak session through the back-channel --backend-
    logout-url, so a returning browser must authenticate again rather than silently resuming.
  evidence: deploy/enclave/docker-compose.yml (oauth2-proxy --backend-logout-url)
  verified: test/lib/oidc_logout.py — asserts re-entry lands on the login form and the KEYCLOAK_IDENTITY
    / KEYCLOAK_SESSION cookies are gone
SRG-APP-000223-WSR-000011:
  status: mitigated
  mechanism: Secure, HttpOnly and SameSite=lax are all stated explicitly rather than inherited, with per-
    request CSRF cookies on a fifteen-minute expiry.
  evidence: deploy/enclave/docker-compose.yml (oauth2-proxy cookie flags)
  verified: test/uat_srg_webtier.sh — the gate reports secure(https):true httponly:true samesite:lax
SRG-APP-000223-WSR-000145:
  status: mitigated
  mechanism: Session identifiers are minted by oauth2-proxy and Keycloak. Nothing in the application accepts
    a client-supplied identifier; the gate rejects a cookie it did not sign.
  evidence: deploy/enclave/docker-compose.yml (oauth2-proxy --cookie-secret)
  verified: ''
SRG-APP-000224-WSR-000135:
  status: redesign
  note: The identifier is unique per session, but "FIPS 140-2 approved random number generator" is a claim
    about the crypto module, not the application. Ties to the FIPS track below — it cannot be closed by
    configuring oauth2-proxy or Keycloak.
  where: FIPS track (SRG-APP-000179-*)
SRG-APP-000224-WSR-000136:
  status: mitigated
  mechanism: Session identifiers come from Keycloak and oauth2-proxy's CSPRNG-backed session layer; neither
    derives an identifier from user or time input, so they are not reproducible.
  evidence: keycloak/realm-irplatform.json, deploy/enclave/docker-compose.yml
  verified: ''
SRG-APP-000224-WSR-000137:
  status: mitigated
  mechanism: Keycloak session identifiers are 128-bit UUIDs; the gate's cookie carries an AES-encrypted
    session payload keyed by --cookie-secret. Neither is brute-forceable.
  evidence: keycloak/realm-irplatform.json
  verified: ''
SRG-APP-000224-WSR-000138:
  status: mitigated
  mechanism: Identifiers are base64/hex encodings over the full character set of their encoding, not a
    restricted alphabet.
  evidence: keycloak/realm-irplatform.json
  verified: ''
SRG-APP-000224-WSR-000139:
  status: mitigated
  mechanism: Entropy is a property of the identity provider's session layer (128-bit), not a tunable of
    the deployment.
  evidence: keycloak/realm-irplatform.json
  verified: ''
SRG-APP-000295-WSR-000012:
  status: mitigated
  mechanism: 'An eight-hour absolute session lifetime, stated in both halves: the gate''s cookie expiry
    and the realm''s ssoSessionMaxLifespan. The shorter wins, and setting only one leaves the other''s
    default in force.'
  evidence: deploy/enclave/docker-compose.yml (--cookie-expire=8h), hashicorp/keycloak/realm- irplatform.json
    (ssoSessionMaxLifespan)
  verified: test/uat_srg_webtier.sh — the gate reports expiry:8h0m0s at startup, which is the deployed
    value
SRG-APP-000295-WSR-000134:
  status: mitigated
  mechanism: The session is re-validated against the identity provider every fifteen minutes, which is
    what makes an idle session lapse and a revoked account stop working mid-session, paired with the realm's
    ssoSessionIdleTimeout.
  evidence: deploy/enclave/docker-compose.yml (--cookie-refresh=15m), hashicorp/keycloak/realm- irplatform.json
    (ssoSessionIdleTimeout)
  verified: test/uat_srg_webtier.sh — the gate reports refresh:after 15m0s
SRG-APP-000219-WSR-000190:
  status: implement
  note: Management sessions are not pinned to their originating address. Boundary already records the
    client address per session, so the enforcement point exists; binding the gate's session to it is the
    work.
  where: deploy/enclave/docker-compose.yml, backend/cases/authentication.py
SRG-APP-000219-WSR-000191:
  status: implement
  note: Same for user sessions. Note the interaction with the brokered path — every analyst arrives from
    the egress worker's address, so the pin must be applied at the broker, not the gate, or every session
    shares one source.
  where: hashicorp/access/boundary_session.sh, deploy/enclave/docker-compose.yml
SRG-APP-000014-WSR-000006:
  status: mitigated
  mechanism: TLS 1.2 floor with an explicit AEAD, forward-secret cipher list and sniStrict, stated in
    the ingress rather than left to the library default.
  evidence: traefik/dynamic-sso/dynamic.yml (tls.options.default)
  verified: test/uat_srg_webtier.sh — a default client negotiates TLSv1.3 with an AEAD suite; TLS 1.1
    is refused at the handshake
SRG-APP-000015-WSR-000014:
  status: mitigated
  mechanism: Every remote session is a Boundary session carried over per-session mutual TLS, reaching
    an ingress that serves TLS only. The analyst has no unencrypted path to reach.
  evidence: SECURITY-MODEL.md P4; hashicorp/access/boundary_session.sh refuses a non-https controller
    address
  verified: test/uat_boundary.sh — the client address is https, the certificate is pinned, and the controller
    API does not answer plaintext
SRG-APP-000172-WSR-000104:
  status: mitigated
  mechanism: Credentials are entered only on the Keycloak login form, reached through the brokered session
    and served over TLS; the broker refuses a plaintext controller address outright.
  evidence: SECURITY-MODEL.md P4; hashicorp/access/boundary_session.sh
  verified: test/uat_boundary.sh; test/uat_baseline.sh (browser OIDC login for all roles)
SRG-APP-000429-WSR-000113:
  status: mitigated
  mechanism: Identifiers and passwords cross the wire only under TLS, and Keycloak stores passwords hashed
    — the application holds no password of its own.
  evidence: SECURITY-MODEL.md P4; keycloak/realm-irplatform.json
  verified: test/uat_baseline.sh
SRG-APP-000439-WSR-000151:
  status: mitigated
  mechanism: TLS on the ingress, Boundary per-session mutual TLS on the approach, Connect mutual TLS between
    enclave services. No hop in the analyst path is cleartext.
  evidence: SECURITY-MODEL.md P4 and P9
  verified: test/uat_boundary.sh; test/uat_consul.sh
SRG-APP-000439-WSR-000152:
  status: mitigated
  mechanism: Session identifiers travel only inside the TLS session; the gate is not reachable over cleartext.
  evidence: traefik/traefik.yml (TLS entrypoint)
  verified: test/uat_baseline.sh
SRG-APP-000439-WSR-000153:
  status: mitigated
  mechanism: 'The session cookie is not compressed, and cannot be: the gate offers no cookie compression
    option, and with the Redis session store the cookie carries a REFERENCE rather than session content
    — there is nothing in it whose compressed length could leak.'
  evidence: deploy/enclave/docker-compose.yml (--session-store-type=redis); oauth2-proxy exposes no cookie-compression
    flag
  verified: test/uat_srg_webtier.sh — the server-side session store is asserted, which is what makes the
    cookie a ticket
SRG-APP-000439-WSR-000154:
  status: mitigated
  mechanism: The gate sets --cookie-secure=true, so the session cookie is sent only over TLS.
  evidence: deploy/enclave/docker-compose.yml (oauth2-proxy --cookie-secure=true)
  verified: ''
SRG-APP-000439-WSR-000155:
  status: mitigated
  mechanism: HttpOnly is set explicitly, so the flag does not rest on an image default that can change.
  evidence: deploy/enclave/docker-compose.yml (--cookie-httponly=true)
  verified: test/uat_srg_webtier.sh — the gate reports httponly:true
SRG-APP-000439-WSR-000156:
  status: mitigated
  mechanism: All transmission to and from the web tier is TLS-protected, and the enclave has no egress
    path over which anything could leave unprotected.
  evidence: SECURITY-MODEL.md P4, P6
  verified: test/uat_dns.sh; test/uat_boundary.sh
SRG-APP-000439-WSR-000188:
  status: mitigated
  mechanism: Export, NULL, RC4 and DES suites are absent because the cipher list names only the six suites
    that are permitted.
  evidence: traefik/dynamic-sso/dynamic.yml (tls.options.default.cipherSuites)
  verified: test/uat_srg_webtier.sh — a client offering only export/NULL/RC4/DES is refused
SRG-APP-000439-WSR-000192:
  status: mitigated
  mechanism: HTTP/2 is configured on the TLS entrypoint and selected over ALPN.
  evidence: traefik/traefik.yml (entryPoints.websecure.http2)
  verified: test/uat_srg_webtier.sh — ALPN selects h2
SRG-APP-000439-WSR-000193:
  status: redesign
  note: 'Not reachable with this ingress. Refusing HTTP/1.x means not OFFERING http/1.1 in ALPN, and Traefik
    exposes no control over the ALPN list — its http2 settings tune streams and header tables only. Meeting
    this needs an ingress that can restrict ALPN, which is an ingress replacement rather than a setting.
    Weigh that against the exposure: HTTP/2 is negotiated and used, the only client is the workstation''s
    managed browser, and the downgrade path is a fallback nothing on the analyst path takes.'
  where: traefik/ — would require a different ingress, or an ALPN control Traefik does not have
SRG-APP-000439-WSR-000196:
  status: mitigated
  mechanism: The platform runs no forward proxy. Traefik is a reverse proxy for one origin, and nothing
    in the enclave has an outbound route for a forward proxy to serve.
  evidence: SECURITY-MODEL.md P6; deploy/enclave/docker-compose.yml
  verified: test/uat_dns.sh
SRG-APP-000441-WSR-000181:
  status: mitigated
  mechanism: Information is prepared for transmission inside the TLS session; the mesh carries service-
    to-service traffic under mutual TLS.
  evidence: SECURITY-MODEL.md P4, P9
  verified: test/uat_consul.sh
SRG-APP-000442-WSR-000182:
  status: mitigated
  mechanism: Reception is the same path in reverse — the ingress accepts only TLS, and data-tier listeners
    are loopback-bound behind their sidecars.
  evidence: SECURITY-MODEL.md P9
  verified: test/uat_consul.sh — denied pairs are refused on the wire
SRG-APP-000179-WSR-000110:
  status: redesign
  note: FIPS 140-2/140-3 validated modules. The images use their distributions' stock OpenSSL/Go crypto,
    which is not a validated module — this needs FIPS-mode base images and a validated provider across
    Traefik, oauth2-proxy, nginx, Keycloak and Python. It is a rebuild of the web tier's runtime, not
    a setting.
  where: FIPS track — every web-tier Dockerfile and base image
SRG-APP-000179-WSR-000111:
  status: redesign
  note: Same FIPS module requirement, stated for the hosted application's crypto.
  where: FIPS track
SRG-APP-000416-WSR-000118:
  status: redesign
  note: Same FIPS module requirement, stated as "cryptographic modules complying with applicable laws".
  where: FIPS track
SRG-APP-000175-WSR-000095:
  status: redesign
  note: RFC 5280 certification path validation implies a real PKI. The platform pins self-signed CAs deliberately
    (the enclave has no egress, so no CRL/OCSP responder is reachable), which satisfies the trust decision
    but not path validation. Meeting this means issuing web-tier certificates from DoD PKI and providing
    revocation data inside the enclave.
  where: PKI track — traefik/gen-cert.sh, hashicorp/access/gen-boundary-cert.sh
SRG-APP-000427-WSR-000186:
  status: implement
  note: 'The PLUMBING is built and inert: hashicorp/keycloak/pki-logon/ holds the x509 browser flow, a
    trust-anchor allow-list and a CRL directory, and deploy.sh renders both the ingress client-auth block
    and the realm flow from IR_PKI_LOGON — rendering the DISABLED form explicitly, so a deployment that
    once had it on stops asking for certificates. Enabling it with no trust anchor is refused, because
    that is a lockout rather than a hardening step. What remains is not code: an issuing CA, cards carrying
    its certificates, and revocation data staged into the enclave. It stays opt-in until an environment
    has them.'
  where: hashicorp/keycloak/pki-logon/, deploy/deploy.sh (pki_logon_render), traefik/dynamic- sso/dynamic.yml,
    deploy/.env (IR_PKI_LOGON)
SRG-APP-000875-WSR-000280:
  status: redesign
  note: A local cache of revocation data presumes revocation data exists (see WSR-000095). Inside an enclave
    with no egress it must be staged in like symbol tables are.
  where: PKI track
SRG-APP-000910-WSR-000300:
  status: mitigated
  mechanism: 'Trust is pinned, not inherited: each client trusts exactly the CA it must. tailscaled''s
    SSL_CERT_FILE REPLACES the system trust pool with the control-plane certificate, and Boundary clients
    pin BOUNDARY_CACERT.'
  evidence: deploy/dmz/docker-compose.yml (SSL_CERT_FILE), hashicorp/access/boundary_session.sh
  verified: test/uat_boundary.sh — the certificate is pinned by the client
SRG-APP-000915-WSR-000310:
  status: mitigated
  mechanism: Vault holds key material and app secrets, with dynamic database credentials and an audit
    device; the unseal key is the operator's, not a container's. The custody HMAC key comes from KV rather
    than a file.
  evidence: SECURITY-MODEL.md P2; hashicorp/vault/vault-setup-ir.sh
  verified: test/uat_vault.sh — credentials are dynamic, minted live, and revocation works
SRG-APP-000176-WSR-000096:
  status: mitigated
  mechanism: Private keys are readable only by the component that serves them. The DMZ holds the Boundary
    controller's certificate and NOT its key, which is asserted rather than assumed.
  evidence: deploy/dmz/docker-compose.yml mounts boundary.crt only
  verified: test/uat_boundary.sh — the controller's private key is not readable in the DMZ
SRG-APP-000033-WSR-000169:
  status: mitigated
  mechanism: Every request passes the SSO gate; Keycloak group membership maps to a platform role, and
    the API enforces per-role permissions. The backend trusts forwarded identity only when the proxy shared
    secret matches, so headers cannot be spoofed by a direct client.
  evidence: backend/cases/authentication.py, backend/cases/rbac.py
  verified: test/uat_baseline.sh; test/uat_e2e.sh (RBAC section — an analyst cannot delete)
SRG-APP-000315-WSR-000003:
  status: mitigated
  mechanism: Remote access is a Boundary session against one target, from a workstation enrolled on a
    deny-by-default tailnet. There is no second path to permit or forbid.
  evidence: SECURITY-MODEL.md P1, P3
  verified: test/uat_boundary.sh; test/uat_tailnet.sh — the tunnel carries the session and bounds it (no
    internal reach)
SRG-APP-000315-WSR-000004:
  status: mitigated
  mechanism: The enclave accepts no connection originated in the DMZ except the Boundary controller API
    and the egress worker's proxy port, both authenticated. The bastion cannot reach the ingress directly.
  evidence: SECURITY-MODEL.md P1
  verified: test/uat_boundary.sh — the bastion cannot reach the enclave ingress except through a session
SRG-APP-000316-WSR-000170:
  status: mitigated
  mechanism: Cancelling a Boundary session immediately drops the analyst's connection, and the broker
    is supervised so it re-establishes only as a new authorized session.
  evidence: hashicorp/access/boundary_session.sh
  verified: test/uat_boundary.sh §5a — a canceled session is replaced by a NEW authorized one, unattended
SRG-APP-000211-WSR-000030:
  status: mitigated
  mechanism: Web-tier containers run as unprivileged users with no shell access granted to service accounts;
    the worker additionally drops all capabilities and runs read-only.
  evidence: deploy/enclave/docker-compose.yml (worker hardening), frontend/Dockerfile
  verified: test/uat_re_workstation.sh (capability assertions on the RE session)
SRG-APP-000211-WSR-000031:
  status: mitigated
  mechanism: 'Anonymous access is impossible: oauth2-proxy fronts the application and redirects every
    unauthenticated request into the OIDC flow.'
  evidence: deploy/enclave/docker-compose.yml (--upstream=http://frontend:8080)
  verified: test/uat_baseline.sh
SRG-APP-000211-WSR-000129:
  status: mitigated
  mechanism: 'Management functions are separated from the hosted application: Keycloak''s admin console
    and master realm are refused at the ingress, and management interfaces are reachable only through
    an administrator''s own forwarder.'
  evidence: traefik/dynamic-sso/dynamic.yml (router idp-deny), admin/README.md
  verified: test/uat_baseline.sh — analysts receive 403 for /admin and /realms/master
SRG-APP-000340-WSR-000029:
  status: mitigated
  mechanism: Security-relevant views (audit trail, platform health, mesh, sessions, repairs) are gated
    on the auditor and admin roles; analysts do not see them.
  evidence: backend/cases/rbac.py, backend/cases/views.py
  verified: test/uat_e2e.sh — RBAC and audit sections
SRG-APP-000380-WSR-000072:
  status: mitigated
  mechanism: Configuration reaches containers as read-only mounts, secrets come from Vault Agent rather
    than files in the image, and the runtime socket is absent from every web-tier container.
  evidence: SECURITY-MODEL.md P2, P10; deploy/enclave/docker-compose.yml
  verified: test/uat_repairs.sh — the executor's posture is asserted from the running container
SRG-APP-000435-WSR-000147:
  status: mitigated
  mechanism: The web tier holds no container runtime access, so no process it runs can stop the server;
    stopping is an operator action on the host, or a named repair request the isolated agent executes.
  evidence: SECURITY-MODEL.md P10; troubleshooting/remediation-agent.sh
  verified: test/uat_repairs.sh — unknown actions and non-admin principals are refused
SRG-APP-000141-WSR-000086:
  status: mitigated
  mechanism: 'Hosted applications cannot reach system resources: containers are unprivileged, the worker
    drops all capabilities with a read-only root filesystem, and the data tier is reachable only through
    mesh sidecars that check an intention.'
  evidence: SECURITY-MODEL.md P7, P9
  verified: test/uat_consul.sh; test/uat_e2e.sh
SRG-APP-000141-WSR-000087:
  status: mitigated
  mechanism: nginx serves the built React bundle from its document root only; there is no CGI, no user
    home directories, and no path outside the image's static root.
  evidence: frontend/nginx.conf.template, frontend/Dockerfile
  verified: ''
SRG-APP-000880-WSR-000290:
  status: mitigated
  mechanism: 'Maintenance access is separated from user access by construction: administrators reach management
    interfaces through their own forwarder, not through the analyst origin, and the analyst target reaches
    only the SSO gate.'
  evidence: admin/README.md; SECURITY-MODEL.md P3
  verified: test/uat_boundary.sh — exactly one target exists, and it is the SSO gate
SRG-APP-000141-WSR-000015:
  status: mitigated
  mechanism: The web server performs no user management. Identity lives in Keycloak; accounts created
    in the admin UI are provisioned there, and the application holds no password.
  evidence: backend/cases/keycloak_admin.py
  verified: test/uat_baseline.sh
SRG-APP-000815-WSR-000160:
  status: mitigated
  mechanism: Each analyst authenticates individually to Keycloak before reaching the application, and
    every mutation is attributed to that account in the audit trail.
  evidence: backend/cases/authentication.py, backend/cases/audit.py
  verified: test/uat_e2e.sh — audit entries carry the acting principal
  note: The BROKERED hop still uses one shared analyst principal (SECURITY-MODEL open item). The web tier
    satisfies this control; per-analyst Boundary principals close it end to end.
SRG-APP-000820-WSR-000170:
  status: implement
  note: MFA is not configured. Keycloak supports OTP as a required action and conditional flow; enabling
    it for the admin and analyst groups is configuration in the realm, not a redesign. Hardware-token
    (CAC/PIV) MFA is the PKI track instead.
  where: keycloak/realm-irplatform.json (browser flow, OTP required action)
SRG-APP-000825-WSR-000180:
  status: implement
  note: Same realm change, stated for non-privileged accounts.
  where: keycloak/realm-irplatform.json
SRG-APP-000830-WSR-000190:
  status: mitigated
  mechanism: 'The realm enforces a password policy: length 15, all four character classes, notUsername
    and notEmail, history 5, forced change on expiry. Read from the RUNNING realm, because an import never
    overwrites an existing one — deploy.sh recreates Keycloak when the realm file changes so the two cannot
    disagree. notUsername and notEmail refuse the two guesses made first.'
  evidence: hashicorp/keycloak/realm-irplatform.json (passwordPolicy)
  verified: test/uat_srg_webtier.sh — the policy is read back from the running realm and each element
    asserted
SRG-APP-000835-WSR-000200:
  status: mitigated
  mechanism: 'Keycloak passwordBlacklist(dfir-platform.txt), added to the realm password policy that converges
    on every deploy (D-008). The list is baked into the image beside the theme and for the same reason:
    a policy naming a file Keycloak cannot read fails password SETTING, and the first sign would be an
    analyst unable to complete a forced reset. Seeded with platform CONTEXT terms as well as weak forms
    — ''IrPlatform#2026'' satisfies length, case, digits and specials, and is the first thing an attacker
    who has read the public repository would try. A composition rule cannot catch that; a list can. It
    gates password setting only, never sign-in.'
  evidence: keycloak/password-blacklists/dfir-platform.txt, keycloak/Dockerfile (COPY + build-time test
    -s), hashicorp/keycloak/realm-irplatform.json passwordPolicy
  verified: uat_srg_webtier.sh — the policy names the list, the file is present and non-empty inside the
    running Keycloak, and the review record is within its interval
SRG-APP-000840-WSR-000210:
  status: mitigated
  mechanism: 'The same list and the same converge path. This control differs from WSR-000200 only in its
    trigger — suspected compromise rather than a schedule — so the mechanism is shared and the RECORD
    is what distinguishes them: --record takes a reason, and an out-of-cycle update states what prompted
    it.'
  evidence: keycloak/password-blacklists/dfir-platform.txt, ci/password-blacklist-check.sh
  verified: uat_srg_webtier.sh — same assertions as WSR-000200, plus the reason field on the record
SRG-APP-000845-WSR-000220:
  status: mitigated
  mechanism: 'The realm enforces a password policy: length 15, all four character classes, notUsername
    and notEmail, history 5, forced change on expiry. Read from the RUNNING realm, because an import never
    overwrites an existing one — deploy.sh recreates Keycloak when the realm file changes so the two cannot
    disagree. Verification happens on every set, since the policy is the realm''s.'
  evidence: hashicorp/keycloak/realm-irplatform.json (passwordPolicy)
  verified: test/uat_srg_webtier.sh — the policy is read back from the running realm and each element
    asserted
SRG-APP-000850-WSR-000230:
  status: mitigated
  mechanism: Passwords are stored salted and hashed with pbkdf2-sha512 at 210,000 iterations, stated explicitly
    in the realm rather than inherited from an image default that drifts between Keycloak releases. The
    platform never sees or stores a password.
  evidence: hashicorp/keycloak/realm-irplatform.json (passwordPolicy) — hashAlgorithm(pbkdf2-sha512) and
    hashIterations(210000)
  verified: test/uat_srg_webtier.sh — an approved salted hash is asserted on the running realm
SRG-APP-000855-WSR-000240:
  status: mitigated
  mechanism: New accounts are created with a temporary password and Keycloak requires a change at first
    sign-in.
  evidence: backend/cases/keycloak_admin.py (temporary password + required action)
  verified: test/uat_ui.sh (user creation)
SRG-APP-000860-WSR-000250:
  status: mitigated
