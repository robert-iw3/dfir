# DFIR_FRAMEWORK login theme.
#
# Extends the stock Keycloak login theme rather than replacing it: every form, error message and
# authentication flow (OTP, password reset, consent) keeps working without being re-implemented
# here, and a Keycloak upgrade that adds a screen does not leave that screen unstyled or broken.
# Only presentation is overridden.
parent=keycloak
import=common/keycloak

# Appended after the parent's stylesheets so these rules win without !important everywhere.
styles=css/login.css
